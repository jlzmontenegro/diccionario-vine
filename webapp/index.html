<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diccionario Vine</title>
  <meta name="description" content="Búsqueda rápida en el Diccionario Expositivo Vine de palabras del Antiguo y Nuevo Testamento.">
  <meta name="theme-color" content="#2c6124" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { const t = localStorage.getItem('vine.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t;
      const f = localStorage.getItem('vine.font'); if (f) document.documentElement.style.setProperty('--reader-size', f + 'px'); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="#/" aria-label="Inicio">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5.5h8.5a3.5 3.5 0 0 1 3.5 3.5v18a3 3 0 0 0-3-3H6z" fill="currentColor" opacity=".35"/><path d="M26 5.5h-8.5A3.5 3.5 0 0 0 14 9v18a3 3 0 0 1 3-3h9z" fill="currentColor"/></svg>
        <span><b>Vine</b> <small>Diccionario expositivo</small></span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnRandom" title="Palabra al azar" aria-label="Palabra al azar">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="icon-btn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" spellcheck="false"
             placeholder="Buscar palabra, griego, hebreo, Strong o cita…" aria-label="Buscar en el diccionario">
      <button type="button" class="icon-btn small" id="btnMic" hidden title="Buscar por voz" aria-label="Buscar por voz">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="button" class="icon-btn small" id="btnClear" hidden title="Borrar" aria-label="Borrar búsqueda">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </form>

    <div class="filters">
      <div class="chips" role="tablist" aria-label="Tipo de búsqueda" id="modes">
        <button role="tab" data-mode="all" aria-selected="true">Todo</button>
        <button role="tab" data-mode="heads">Palabra</button>
        <button role="tab" data-mode="text">Texto completo</button>
        <button role="tab" data-mode="orig">Griego / Hebreo</button>
        <button role="tab" data-mode="ref">Cita bíblica</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Testamento" id="testament">
        <button role="radio" data-f="" aria-checked="true">Todos</button>
        <button role="radio" data-f="AT" aria-checked="false">AT</button>
        <button role="radio" data-f="NT" aria-checked="false">NT</button>
      </div>
    </div>
  </header>

  <div class="layout" id="main">
    <section class="pane list-pane" id="listPane" aria-live="polite"></section>
    <article class="pane reader-pane" id="reader" tabindex="-1" aria-label="Artículo"></article>
  </div>

  <nav class="bottomnav" aria-label="Navegación principal">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
    <a href="#/buscar" data-nav="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar</span></a>
    <a href="#/indice/A" data-nav="index"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg><span>Índice</span></a>
    <a href="#/guardados" data-nav="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Guardados</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="tplLoading">
    <div class="loading"><div class="spinner"></div><p>Cargando diccionario…</p></div>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
